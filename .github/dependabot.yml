# Dependabot moves the pins of the actions of the workflows to their newest releases, in one pull
# request each week.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
